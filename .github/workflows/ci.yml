name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formatting
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest
      - name: Shell scripts
        # `bash -n a.sh b.sh` only checks a.sh, so check each file. shellcheck is
        # preinstalled on GitHub's Ubuntu runners.
        run: |
          for f in scripts/*.sh scripts/pi/*.sh; do bash -n "$f"; done
          shellcheck scripts/*.sh scripts/pi/*.sh
