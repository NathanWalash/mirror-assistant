# Mirror's SHARED default settings (committed; the repo is public).
#
# Your own settings live in config.yaml, which is git-ignored. scripts/setup.sh creates
# it as a copy of this file. Anything you delete from config.yaml falls back to the
# value here, so it can be as short as:
#   tts:
#     voice: kokoro_bm_lewis
#
# Restart scripts/talk.sh after changing settings. (The persona file is different:
# it's re-read on every reply, no restart needed.)

# Who Mirror is. Plain English; edit this file to change the personality.
# Your private copy (git-ignored), created from mirror.example.md by scripts/setup.sh.
persona: personality/personas/mirror.md

llm:
  # llama.cpp server that does the thinking. scripts/talk.sh starts it for you.
  port: 8080
  # Hugging Face repo:quant that llama.cpp downloads on first run (~2 GB).
  model: mradermacher/Hermes-3-Llama-3.2-3B-abliterated-i1-GGUF:Q4_K_M
  context_size: 8192
  temperature: 0.8     # higher = more random/creative, lower = more predictable
  max_tokens: 150      # hard cap on reply length
  history_turns: 10    # how many recent messages it remembers

stt:
  # Moonshine speech-to-text model: tiny_streaming | small_streaming | medium_streaming
  # Bigger = more accurate but slower. small_streaming is our bet for the Pi.
  model: small_streaming

tts:
  # Mirror's voice. Change this one line and restart talk.sh.
  # List every option with:  uv run mirror-talk --voices
  #   kokoro_*  : most natural (e.g. kokoro_bm_george, kokoro_bm_lewis, kokoro_bf_emma)
  #   piper_*   : fastest, more robotic (e.g. piper_en_GB-alan-medium)
  #   zipvoice_*: many accents, slowest
  voice: kokoro_bm_george
  language: en-gb      # accent/pronunciation rules (en-gb or en-us)
  speed: 1.0           # >1 talks faster, <1 slower
  volume: 1.0

display:
  # The mirror screen (orb, subtitles, widgets), served while talk.sh or mirror-hub runs.
  enabled: true
  port: 8765
  open_browser: true   # open it automatically in your browser

widgets:
  # Info shown around the orb. Each widget has `enabled` and `refresh_minutes`
  # (optional; each widget has a sensible default), plus its own settings.
  # Check one without the voice loop:  uv run mirror-hub --once weather
  weather:
    enabled: true
    refresh_minutes: 15
    # Open-Meteo forecast, no API key. Put YOUR location in config.yaml (git-ignored);
    # this default is Leeds city centre.
    latitude: 53.7997
    longitude: -1.5492
    place: Leeds         # label on the mirror; leave empty to hide
    rain_hours: 6        # how far ahead the "rain likely from..." line looks
