# Mirror's SHARED default settings (committed; the repo is public).
#
# Your own settings live in config.yaml, which is git-ignored. scripts/setup.sh creates
# it as a copy of this file. Anything you delete from config.yaml falls back to the
# value here, so it can be as short as:
#   tts:
#     voice: kokoro_bm_lewis
#
# Restart scripts/talk.sh after changing settings. (The persona file is different:
# it's re-read on every reply, no restart needed.)

assistant:
  # What the assistant is called: used on screen, in the console and taught to
  # speech-to-text so it hears the name properly. (Its personality, including what it
  # calls itself in conversation, is the persona file below.)
  name: Mirror

# Who Mirror is. Plain English; edit this file to change the personality.
# Your private copy (git-ignored), created from mirror.example.md by scripts/setup.sh.
persona: personality/personas/mirror.md

llm:
  # llama.cpp server that does the thinking. scripts/talk.sh starts it for you.
  port: 8080
  # Hugging Face repo:quant that llama.cpp downloads on first run (~2 GB).
  model: mradermacher/Hermes-3-Llama-3.2-3B-abliterated-i1-GGUF:Q4_K_M
  context_size: 8192
  temperature: 0.8     # higher = more random/creative, lower = more predictable
  max_tokens: 150      # hard cap on reply length
  history_turns: 10    # how many recent messages it remembers

stt:
  # Moonshine speech-to-text model: tiny_streaming | small_streaming | medium_streaming
  # Bigger = more accurate but slower. small_streaming is our bet for the Pi.
  model: small_streaming
  # Names and unusual words to listen out for, so they aren't heard as ordinary words.
  # The assistant's name is added automatically. Only *_streaming models support this.
  # Put your flatmates' names in your config.yaml, never here (this file is public), e.g.
  #   keyterms: [Alex, Sam, Headingley]
  # Keep the list short: each extra term costs a little accuracy on other words.
  keyterms: []

tts:
  # Mirror's voice. Change this one line and restart talk.sh.
  # List every option with:  uv run mirror-talk --voices
  #   kokoro_*  : most natural (e.g. kokoro_bm_george, kokoro_bm_lewis, kokoro_bf_emma)
  #   piper_*   : fastest, more robotic (e.g. piper_en_GB-alan-medium)
  #   zipvoice_*: many accents, slowest
  voice: kokoro_bm_george
  language: en-gb      # accent/pronunciation rules (en-gb or en-us)
  speed: 1.0           # >1 talks faster, <1 slower
  volume: 1.0

display:
  # The mirror screen (orb, subtitles, widgets), served while talk.sh or mirror-hub runs.
  enabled: true
  port: 8765
  open_browser: true   # open it automatically in your browser
  # Dim the whole screen at night so the mirror doesn't light up the room. Times are the
  # screen's local time and may span midnight. brightness: 0 = black, 1 = no dimming.
  # Set `night: false` to turn it off.
  night:
    start: "00:00"
    end: "06:30"
    brightness: 0.15

widgets:
  # Info shown around the orb. Each widget has `enabled` and `refresh_minutes`
  # (optional; each widget has a sensible default), plus its own settings.
  # Check one without the voice loop:  uv run mirror-hub --once weather
  weather:
    enabled: true
    refresh_minutes: 15
    # Open-Meteo forecast, no API key. Put YOUR location in config.yaml (git-ignored);
    # this default is Leeds city centre.
    latitude: 53.7997
    longitude: -1.5492
    place: Leeds         # label on the mirror; leave empty to hide
    rain_hours: 6        # how far ahead the "rain likely from..." line looks

  calendar:
    enabled: true
    refresh_minutes: 10
    days: 4              # today plus the next 3 days
    max_events: 7        # most events on screen at once (later ones become "+3 more")
    timezone: Europe/London
    # Your RSVP shows on each event: solid dot = going, ring + "maybe" = tentative,
    # faint dot + "?" = not replied. Declined and cancelled events are hidden unless:
    show_declined: false
    show_cancelled: false
    # Whose calendars to show. Each private link lets anyone who has it read that
    # calendar, so they go ONLY in your git-ignored config.yaml, never in this file:
    #
    #   widgets:
    #     calendar:
    #       calendars:
    #         - name: Alex
    #           url: "https://calendar.google.com/calendar/ical/.../basic.ics"
    #           colour: "#6fb6ff"      # optional dot colour
    #         - name: Sam
    #           url: "https://outlook.office365.com/owa/calendar/.../calendar.ics"
    #           email: "sam@example.com"   # optional: whose RSVPs to read. Google feeds
    #                                      # name their owner already; never shown or logged
    #
    # Getting the link:
    #   Google Calendar (on a computer): Settings > click your calendar under "Settings for
    #     my calendars" > "Integrate calendar" > copy "Secret address in iCal format".
    #   Outlook.com / Microsoft 365: Settings > Calendar > Shared calendars > "Publish a
    #     calendar" > pick the calendar and "Can view all details" > Publish > copy the ICS link.
    #   Apple iCloud: Calendar app > share icon by the calendar > tick "Public Calendar" >
    #     copy the webcal:// link (anyone with it can see the calendar).
    # Check it with:  uv run mirror-hub --once calendar
    calendars: []

  bus:
    enabled: true
    refresh_minutes: 1
    # Next buses from your stop, from the Bus Open Data Service (BODS). The timetable
    # needs no key; live bus positions need a free BODS_API_KEY in .env (git-ignored).
    # Put YOUR stop's ATCO code in config.yaml: find it on bustimes.org (the 9+ digit
    # code on the stop's page; West Yorkshire codes start 450). This default is a public
    # city-centre stop: Leeds Trinity (stop R), Boar Lane.
    stops: ["450010687"]   # one or more stops, e.g. both sides of the road
    routes: []           # only these route numbers, e.g. ["33", "33A"]; empty = all
    max_departures: 5
    walk_minutes: 0      # hide buses leaving sooner than you can get to the stop
    horizon_minutes: 90  # how far ahead to look
    name: ""             # label on the mirror; empty = the stop's name
    region: yorkshire    # which BODS GTFS region file holds your stop
    # Optional: split your stops by direction, each with its own heading. The groups'
    # stops replace `stops` above. Codes here are placeholders, not real stops:
    #
    #   groups:
    #     - label: Town
    #       stops: ["450000001"]
    #     - label: Out of town
    #       stops: ["450000002", "450000003"]
    #       max_departures: 2   # optional, per group
    max_per_group: 3     # buses shown under each group heading
