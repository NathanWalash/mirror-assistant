[project]
name = "mirror-voice"
version = "0.1.0"
description = "Mirror's voice loop: listen (Moonshine) -> think (llama.cpp) -> speak (Piper)."
requires-python = ">=3.12"
dependencies = [
    "moonshine-voice>=0.1.5",
    "piper-tts>=1.8",
    "sounddevice>=0.5",
    "numpy>=2",
    "pyyaml>=6",
]

[project.scripts]
mirror-talk = "mirror_voice.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirror_voice"]
