[project]
name = "mirror-voice"
version = "0.1.0"
description = "Mirror's voice loop: listen (Moonshine) -> think (llama.cpp) -> speak (Kokoro/Piper via Moonshine)."
requires-python = ">=3.12"
dependencies = [
    "moonshine-voice>=0.1.5",
    "sounddevice>=0.5",
    "numpy>=2",
    "pyyaml>=6",
    "icalendar>=7.3.0",
    "recurring-ical-events>=3.8.2",
]

[project.scripts]
mirror-talk = "mirror_voice.app:main"
mirror-hub = "mirror_voice.hub.cli:main"
mirror-eval = "mirror_voice.personality_eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirror_voice"]
